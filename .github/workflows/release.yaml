name: release

# Go modules are published by pushing a semver tag (vX.Y.Z).
# This workflow re-runs the tests, creates the GitHub release
# and warms the Go module proxy so the version is immediately resolvable.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease

      - name: Warm the Go module proxy
        run: |
          module="$(go list -m)"
          curl -fsS "https://proxy.golang.org/${module}/@v/${GITHUB_REF_NAME}.info"
